# BH1 — pinned benchmark host fingerprint (U0.8 / PB-1).
#
# `perf_budget` strictly matches every `[fingerprint]` field against the current
# machine; any mismatch yields `INVALID_HOST` and invalidates the run. The
# `[conditions]` records BH1's exact runtime preconditions: governor
# `powersave`, `SwapTotal` `403979000` KiB, CPU affinity `0-19`, memory
# policy `bind`, and memory nodes `0`. These values are runtime-tunable and are
# not part of immutable host identity. A run is valid only while all match.
# `[source]` names the evidence each fingerprint and condition field uses, per
# `.outline/wayfinder/decisions/performance-resource-budgets.md` §3.
schema = 2
host = "BH1"

# Immutable hardware/OS identity. Read live and compared byte-for-byte.
[fingerprint]
kernel_release = "7.0.0-30-generic"
kernel_version = "#30-Ubuntu SMP PREEMPT_DYNAMIC"
arch = "x86_64"
cpu_model = "Intel(R) Xeon(R) Gold 6138 CPU @ 2.00GHz"
sockets = 2
cores_per_socket = 20
microcode = "0x2007006"

# Measurement preconditions. Read live, recorded, and matched exactly.
[conditions]
governor = "powersave"
swap_total_kib = 403979000
cpu_affinity = "0-19"
memory_policy = "bind"
memory_nodes = "0"

# Fingerprint / condition evidence sources.
[source]
kernel_release = "/proc/version"
kernel_version = "/proc/version"
cpu_model = "/proc/cpuinfo"
sockets = "/proc/cpuinfo"
cores_per_socket = "/proc/cpuinfo"
microcode = "/proc/cpuinfo"
swap_total_kib = "/proc/meminfo"
governor = "/sys/devices/system/cpu/cpu0/cpufreq/scaling_governor"
cpu_affinity = "/proc/thread-self/status:Cpus_allowed_list"
memory_policy = "get_mempolicy(2), flags=0"
memory_nodes = "get_mempolicy(2), flags=0"
