# Benchmark and fixture manifest (U0.10 / PB-3).
#
# [[benchmark]] retains the vertical-slice performance seams. [[fixture]] pins
# tracked upstream workloads, corpus trees, CLI inputs, and generated boundaries.
# Regenerate upstream/boundary inputs with `perf_budget materialize-fixtures` and
# verify every hash offline with `perf_budget verify-fixtures`.
schema = 2

[[benchmark]]
id = "s0-conformance-foundation"
slice = "s0"
input = "index.json"
facets = ["harness"]
backends = ["check"]
expected = "perf/baselines/s0.json"
selected = true
repeats = 3
timeout_ms = 30000

