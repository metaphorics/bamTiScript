# Benchmark manifest (U0.8 / PB-1).
#
# One entry per vertical slice. Each entry names the workload the slice's
# performance gate measures. `input` is relative to the materialized suite root
# `verification/ts-suite`; `expected` is the baseline-artifact path (populated by
# U0.10, PB-3). `repeats` defaults to 3. Only the `s0` entry is exercised in this
# unit; later slices are placeholders wired to representative case inputs and are
# filled with real fixtures as each slice lands.
schema = 1

[[benchmark]]
id = "s0-conformance-foundation"
slice = "s0"
input = "index.json"
facets = ["harness"]
backends = ["check"]
expected = "perf/baselines/s0.json"
repeats = 3
timeout_ms = 30000

