# Pre-registered benchmark rules for the bamTiScript performance-evidence track.
#
# Every rule in this file is registered BEFORE any measurement is taken. The
# harness may only accept a measurement that satisfies a rule already written
# here; it may never widen a rule, re-register it, or select the friendliest of
# several runs. A rule that cannot be decided on the current host records an
# explicit non-accepting state instead of a number.
#
# The nine rule identifiers are the closed inventory declared by
# `verification/catalog-inputs.json` for the `benchmarks` catalog. Ledger rows
# cite individual rules as `bench/compiler-rules.toml#<rule id>`.

schema = "bamti.compiler-rules/v1"

# Host conditions required for any measurement to be valid.
#
# These are methodology requirements, not measured values. A host that does not
# satisfy them yields INVALID_CONDITIONS; the harness never normalizes, scales,
# or otherwise repairs a non-conforming host.
[conditions]
# Every online CPU must report one of these cpufreq governors. An unreadable
# governor is a mismatch, not a pass.
required_governors = ["performance"]
# Swap must be fully disabled: /proc/meminfo SwapTotal must be 0 kB.
require_swap_disabled = true
# The measuring process must be pinned to an explicit CPU set.
require_pinned_affinity = true
# A pin covering every present CPU is not a pin.
forbid_full_machine_affinity = true
# Conditions are captured before and after the samples; any drift between the
# two captures invalidates the run.
recapture_after_run = true

# Sampling policy shared by every timing rule.
[measurement]
# Median only. Means are not accepted: one descheduled sample must not move the
# reported value.
statistic = "median"
# Sample count for median-of-N. Registered in advance and required to be odd so
# the median is an observed sample rather than an interpolation.
samples = 9
# Warmup iterations discarded before sampling begins.
warmup = 2

# --- JIT timing rules (E5.2) -------------------------------------------------
#
# Each JIT rule names the counter it reads out of the runtime's `--json` output.
# No counter is derived from total process wall time: a whole-process duration
# does not isolate compilation from execution, so substituting it would be a
# fabricated measurement. Until the runtime emits the named counter, these rules
# resolve to MEASUREMENT_UNAVAILABLE and remain unaccepted.

[rule."jit.compile-cost"]
kind = "duration"
unit = "nanoseconds"
direction = "lower-is-better"
workload = "corpus/cases/valita.ts"
argv = ["-r", "--jit", "--json"]
metric_key = "jit.compile_ns"
requires = "runtime emits the jit.compile_ns counter in --json run output"

[rule."jit.payback"]
kind = "count"
unit = "iterations"
direction = "lower-is-better"
workload = "corpus/cases/valita.ts"
argv = ["-r", "--jit", "--json"]
metric_key = "jit.payback_iterations"
requires = "runtime emits the jit.payback_iterations counter in --json run output"

[rule."jit.queue-tail-latency"]
kind = "duration"
unit = "nanoseconds"
direction = "lower-is-better"
workload = "corpus/cases/valita.ts"
argv = ["-r", "--jit", "--json"]
metric_key = "jit.queue_tail_latency_ns"
requires = "runtime emits per-request compile-queue latency in --json run output"

# --- Stage-0 evidence rules (E5.3) ------------------------------------------
#
# These are predicates, not timings, so the sampling policy above does not
# apply. Each names the observation that decides it. A predicate with no
# observation is unavailable, never a pass.

[rule."stage0.correctness"]
kind = "predicate"
decided_by = "differential"
workload = "corpus/cases/valita.ts"
argv = ["-r", "--jit"]
baseline_argv = ["-r", "--aot"]
requires = "both execution targets run the workload to completion"

[rule."stage0.integrity"]
kind = "predicate"
decided_by = "reproducible-artifact"
workload = "corpus/cases/valita.ts"
argv = ["-c", "--aot"]
requires = "two independent compilations of one input produce byte-identical artifacts"

[rule."stage0.no-rwx"]
kind = "predicate"
decided_by = "process-maps"
workload = "corpus/cases/valita.ts"
argv = ["-r", "--jit"]
requires = "at least one address-space sample is captured while the process is live"

[rule."stage0.event-completeness"]
kind = "predicate"
decided_by = "event-stream"
workload = "corpus/cases/event-loop.ts"
argv = ["-r", "--jit", "--json"]
metric_key = "events"
requires = "runtime emits the ordered event stream in --json run output"

[rule."stage0.aot-no-jit-allocator"]
kind = "predicate"
decided_by = "process-maps"
workload = "corpus/cases/valita.ts"
argv = ["-r", "--aot"]
requires = "at least one address-space sample is captured while the process is live"

# --- Stage-1 regression guard (E5.4) ---------------------------------------
#
# The comparison is registered here in full before stage 1 is measured. The
# tolerance is read from the registered baseline document, never from this file
# and never from the run being judged, so a regression cannot be absorbed by
# widening a threshold after the fact. A missing or host-mismatched baseline
# fails the guard closed.

[rule."stage1.pre-registered-regression"]
kind = "guard"
unit = "nanoseconds"
direction = "lower-is-better"
statistic = "median"
workload = "corpus/cases/valita.ts"
argv = ["-r", "--jit", "--json"]
metric_key = "stage1.total_ns"
baseline = "bench/baselines/stage1.json"
tolerance_source = "baseline"
requires = "a registered stage-1 baseline recorded on the measuring host"
