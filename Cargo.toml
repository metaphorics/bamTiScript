[workspace]
members = [
    "crates/bamts-compiler",
    "crates/bamts-bytecode",
    "crates/bamts-runtime",
    "crates/bamts-native",
    "crates/bamts-node",
    "crates/bamts-codegen",
    "crates/bamts-cli",
    "crates/bamts-verification",
    "crates/bamts",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = true
license = "MIT"
repository = "https://github.com/metaphorics/bamTiScript"
[workspace.lints.rust]
unsafe_code = "forbid"
