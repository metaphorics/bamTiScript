[package]
name = "bamts-verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "Verification and compliance test suite for BamTS"

[dependencies]
bamts = { workspace = true, features = ["aot"] }
bamts-bytecode.workspace = true
bamts-cli.workspace = true
bamts-codegen.workspace = true
bamts-compiler.workspace = true
bamts-native.workspace = true
bamts-node = { workspace = true, features = ["script-compiler"] }
bamts-runtime.workspace = true
anyhow = "=1.0.104"
quint-connect = "=0.1.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
toml = "=0.9.12"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[[bin]]
name = "ts_conformance"
path = "src/bin/ts_conformance.rs"

[[bin]]
name = "perf_budget"
path = "src/bin/perf_budget.rs"

[lints.rust]
# `unsafe_code` is downgraded from the workspace `forbid` to `deny` so a
# single `#[allow(unsafe_code)]` may cover the `libc::killpg` call in
# `terminate_process_group`.
unsafe_code = "deny"
