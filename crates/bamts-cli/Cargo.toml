[package]
name = "bamts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "BamTS compiler command-line driver"

[[bin]]
name = "bamts"
path = "src/main.rs"

[dependencies]
bamts = { path = "../bamts", version = "0.1.0", features = ["node-host"] }
bamts-compiler = { path = "../bamts-compiler", version = "0.1.0" }
bamts-runtime = { path = "../bamts-runtime", version = "0.1.2" }
bamts-codegen = { path = "../bamts-codegen", version = "0.1.0", features = ["aot", "host-jit"] }
bamts-node = { path = "../bamts-node", version = "0.1.0" }

[build-dependencies]
bamts-node = { path = "../bamts-node", version = "0.1.0", features = ["aot-main", "script-compiler"] }

[lints]
workspace = true
