[package]
name = "bamts-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "BamTS compiler command-line driver"

[[bin]]
name = "bamts"
path = "src/main.rs"

[dependencies]
bamts = { workspace = true, features = ["node-host"] }
bamts-cancel.workspace = true
bamts-compiler.workspace = true
bamts-runtime.workspace = true
bamts-codegen = { workspace = true, features = ["aot", "host-jit"] }
bamts-node.workspace = true
bamts-native = { workspace = true, features = ["cache-guard"] }
processkit = "=3.3.1"
tempfile = "=3.27.0"
tokio = { version = "1.39", features = ["rt", "time", "macros"] }

[build-dependencies]
bamts-node = { workspace = true, features = ["aot-main", "script-compiler"] }
serde_json = "=1.0.151"

[lints]
workspace = true
