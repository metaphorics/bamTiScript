[package]
name = "bamts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
description = "BamTS compiler and runtime framework"

[features]
default = []
aot = ["dep:bamts-codegen", "bamts-codegen/aot"]
host-jit = ["dep:bamts-codegen", "bamts-codegen/host-jit"]
node-host = ["dep:bamts-node", "bamts-node/node-host", "bamts-node/script-compiler"]

[dependencies]
bamts-bytecode.workspace = true
bamts-codegen = { workspace = true, optional = true }
bamts-compiler.workspace = true
bamts-node = { workspace = true, optional = true }
bamts-runtime.workspace = true
bamts-cancel.workspace = true

[lints]
workspace = true
