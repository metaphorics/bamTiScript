name: Native string oracle

on:
  push:
    paths:
      - .github/workflows/native-string-oracle.yml
      - npm/scripts/native-string-oracle.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            runner: ubuntu-24.04
          - label: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - label: darwin-x64
            runner: macos-15-intel
          - label: darwin-arm64
            runner: macos-15
          - label: win32-x64-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record Node string behavior
        shell: pwsh
        run: node npm/scripts/native-string-oracle.mjs | Tee-Object -FilePath native-string-oracle-${{ matrix.label }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-string-oracle-${{ matrix.label }}-${{ github.run_attempt }}
          path: native-string-oracle-${{ matrix.label }}.txt
          if-no-files-found: error
          retention-days: 14
          archive: false
